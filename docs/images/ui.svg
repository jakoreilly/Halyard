<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="520" rx="14" fill="#0e1116"/>
  <text x="28" y="34" fill="#e6edf3" font-size="14" font-weight="650">The page, mid-run</text>
  <text x="28" y="53" fill="#5b6878" font-size="11.5">A drawing of the real markup, not a photograph. Replace with a screenshot from your own install.</text>

  <!-- ================= panel 1: a run in flight ================= -->
  <g transform="translate(28,76)">
    <rect width="270" height="410" rx="22" fill="#161b23" stroke="#2a323f"/>
    <rect x="12" y="12" width="246" height="386" rx="14" fill="#0e1116"/>

    <circle cx="30" cy="36" r="4.5" fill="#52d18b"/>
    <text x="44" y="40" fill="#e6edf3" font-size="12.5" font-weight="650">Halyard</text>
    <rect x="150" y="27" width="52" height="18" rx="9" fill="#161b23" stroke="#2a323f"/><text x="176" y="40" fill="#93a1b3" font-size="9.5" text-anchor="middle">1 queued</text>
    <rect x="206" y="27" width="40" height="18" rx="9" fill="#161b23" stroke="#5eb3ff"/><text x="226" y="40" fill="#5eb3ff" font-size="9.5" text-anchor="middle">claude</text>

    <!-- run box -->
    <rect x="24" y="58" width="222" height="132" rx="11" fill="#161b23" stroke="#1d3a56"/>
    <circle cx="38" cy="76" r="3.5" fill="#5eb3ff"/>
    <text x="48" y="80" fill="#93a1b3" font-size="9" letter-spacing=".08em">RUNNING</text>
    <text x="36" y="99" fill="#e6edf3" font-size="10.5">main · claude · opus · 214s</text>
    <rect x="196" y="88" width="42" height="17" rx="8" fill="none" stroke="#ff6b6b"/><text x="217" y="100" fill="#ff6b6b" font-size="9" text-anchor="middle">Stop</text>
    <text x="36" y="118" fill="#93a1b3" font-size="10">Edit watcher.js</text>
    <line x1="36" y1="128" x2="234" y2="128" stroke="#2a323f" stroke-dasharray="3 3"/>
    <text x="36" y="145" fill="#7f8c9d" font-size="9.5">I've bounded the stderr read the same</text>
    <text x="36" y="158" fill="#7f8c9d" font-size="9.5">way as stdout, so a lingering child</text>
    <text x="36" y="171" fill="#7f8c9d" font-size="9.5">can't hold the lock. Running tests…</text>
    <text x="36" y="184" fill="#4a5768" font-size="8.5">draft — the answer, before it lands</text>

    <!-- steps -->
    <rect x="24" y="200" width="222" height="26" rx="9" fill="#161b23" stroke="#2a323f"/>
    <text x="36" y="217" fill="#93a1b3" font-size="10">▸ 24 steps</text>

    <!-- replies -->
    <text x="30" y="252" fill="#93a1b3" font-size="9" letter-spacing=".08em">REPLIES</text>
    <rect x="24" y="260" width="222" height="86" rx="11" fill="#161b23" stroke="#2a323f"/>
    <text x="36" y="278" fill="#5b6878" font-size="9">2m ago · main · $0.0812 · 63s</text>
    <text x="36" y="296" fill="#e6edf3" font-size="10">Done — the bound now covers stderr</text>
    <text x="36" y="310" fill="#e6edf3" font-size="10">too, and there's a test that spawns a</text>
    <text x="36" y="324" fill="#e6edf3" font-size="10">grandchild to prove it.</text>
    <g font-size="8.5" fill="#93a1b3">
      <rect x="36" y="330" width="34" height="14" rx="7" fill="none" stroke="#2a323f"/><text x="53" y="340" text-anchor="middle">Read</text>
      <rect x="76" y="330" width="34" height="14" rx="7" fill="none" stroke="#2a323f"/><text x="93" y="340" text-anchor="middle">Copy</text>
    </g>

    <!-- compose -->
    <rect x="24" y="356" width="170" height="30" rx="9" fill="#1d232d" stroke="#2a323f"/>
    <text x="36" y="375" fill="#5b6878" font-size="10">Message the agent…</text>
    <rect x="200" y="356" width="46" height="30" rx="9" fill="#5eb3ff"/>
    <text x="223" y="375" fill="#06121f" font-size="10.5" font-weight="700" text-anchor="middle">Send</text>
  </g>

  <!-- ================= panel 2: approval ================= -->
  <g transform="translate(318,76)">
    <rect width="270" height="410" rx="22" fill="#161b23" stroke="#2a323f"/>
    <rect x="12" y="12" width="246" height="386" rx="14" fill="#0e1116"/>

    <circle cx="30" cy="36" r="4.5" fill="#52d18b"/>
    <text x="44" y="40" fill="#e6edf3" font-size="12.5" font-weight="650">Halyard</text>

    <rect x="24" y="58" width="222" height="128" rx="11" fill="#161b23" stroke="#f0b429"/>
    <text x="36" y="78" fill="#f0b429" font-size="9" letter-spacing=".08em">NEEDS YOUR APPROVAL</text>
    <text x="36" y="98" fill="#e6edf3" font-size="10.5">A headless run wants to run a git</text>
    <text x="36" y="112" fill="#e6edf3" font-size="10.5">command (Bash). Approve?</text>
    <rect x="36" y="122" width="198" height="24" rx="7" fill="#1d232d"/>
    <text x="44" y="138" fill="#c6d2df" font-size="9.5" font-family="ui-monospace, Menlo, Consolas, monospace">git push origin main</text>
    <rect x="36" y="154" width="72" height="24" rx="8" fill="#5eb3ff"/>
    <text x="72" y="170" fill="#06121f" font-size="10" font-weight="700" text-anchor="middle">Approve</text>
    <rect x="116" y="154" width="60" height="24" rx="8" fill="none" stroke="#ff6b6b"/>
    <text x="146" y="170" fill="#ff6b6b" font-size="10" text-anchor="middle">Deny</text>

    <!-- status -->
    <text x="30" y="212" fill="#93a1b3" font-size="9" letter-spacing=".08em">STATUS</text>
    <rect x="24" y="220" width="222" height="166" rx="11" fill="#161b23" stroke="#2a323f"/>
    <text x="36" y="240" fill="#f0b429" font-size="9.5">⚠ permissionMode is "bypassPermissions".</text>
    <text x="36" y="253" fill="#f0b429" font-size="9.5">The relay is your only backstop.</text>
    <g font-size="9" fill="#7f8c9d" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="36" y="276">workspace   ~/code/api</text>
      <text x="36" y="290">engine      claude   mode bypass…</text>
      <text x="36" y="304">relay       on</text>
      <text x="36" y="318">lock        free</text>
      <text x="36" y="332">push        2 subscriber(s)</text>
    </g>
    <text x="36" y="356" fill="#93a1b3" font-size="10">▸ Scheduled messages</text>
    <text x="36" y="372" fill="#93a1b3" font-size="10">▸ Spend (7 days)</text>
  </g>

  <!-- ================= panel 3: notification ================= -->
  <g transform="translate(608,76)">
    <rect width="264" height="410" rx="22" fill="#161b23" stroke="#2a323f"/>
    <rect x="12" y="12" width="240" height="386" rx="14" fill="#12171f"/>

    <text x="30" y="46" fill="#5b6878" font-size="10">Locked screen</text>

    <rect x="24" y="60" width="216" height="92" rx="14" fill="#1d232d" stroke="#2a323f"/>
    <rect x="36" y="72" width="18" height="18" rx="5" fill="#5eb3ff"/>
    <text x="62" y="85" fill="#e6edf3" font-size="10.5" font-weight="650">Halyard</text>
    <text x="36" y="106" fill="#c6d2df" font-size="10">A headless run wants to run a git</text>
    <text x="36" y="119" fill="#c6d2df" font-size="10">command (Bash). Approve?</text>
    <line x1="36" y1="128" x2="228" y2="128" stroke="#2a323f"/>
    <text x="84" y="143" fill="#5eb3ff" font-size="10" text-anchor="middle" font-weight="650">Approve</text>
    <line x1="132" y1="130" x2="132" y2="150" stroke="#2a323f"/>
    <text x="180" y="143" fill="#ff6b6b" font-size="10" text-anchor="middle">Deny</text>

    <rect x="24" y="168" width="216" height="88" rx="14" fill="#1d232d" stroke="#2a323f"/>
    <rect x="36" y="180" width="18" height="18" rx="5" fill="#5eb3ff"/>
    <text x="62" y="193" fill="#e6edf3" font-size="10.5" font-weight="650">Reply · main</text>
    <text x="36" y="214" fill="#c6d2df" font-size="10">Done — the bound now covers stderr</text>
    <text x="36" y="227" fill="#c6d2df" font-size="10">too, and there's a test to prove it.</text>
    <line x1="36" y1="236" x2="228" y2="236" stroke="#2a323f"/>
    <rect x="36" y="242" width="192" height="0" fill="none"/>
    <text x="132" y="249" fill="#5eb3ff" font-size="10" text-anchor="middle" font-weight="650">Reply…</text>

    <rect x="24" y="278" width="216" height="108" rx="11" fill="#161b23" stroke="#2a323f"/>
    <text x="36" y="300" fill="#93a1b3" font-size="10">Both are answered from the</text>
    <text x="36" y="315" fill="#93a1b3" font-size="10">notification itself — no tab is</text>
    <text x="36" y="330" fill="#93a1b3" font-size="10">opened and none needs to be.</text>
    <text x="36" y="354" fill="#5b6878" font-size="9.5">Payload encrypted end to end (RFC 8291),</text>
    <text x="36" y="368" fill="#5b6878" font-size="9.5">delivered from your machine. The push</text>
    <text x="36" y="382" fill="#5b6878" font-size="9.5">service relays bytes it cannot read.</text>
  </g>
</svg>
